name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (v5.1.0 / v5.6.0, verified against the official repos' tag
      # listings 2026-07-26); never float third-party actions on a tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest ruff mypy
      - name: Lint
        run: ruff check src tests tools
      - name: Typecheck
        run: mypy
      - name: Test
        run: pytest
      - name: Eval report is generated, not hand-edited
        # Regenerating the MD from the committed JSON must be byte-identical;
        # a hand edit to either file fails the build (pin for Phase 6.5).
        run: python tools/check_eval_freshness.py
